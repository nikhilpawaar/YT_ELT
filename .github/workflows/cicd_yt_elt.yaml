name: CI-CD Pipeline

on:
  push:
    branches:
      - main
      - 'feature/*'

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get changed files for build
        id: changed-files-build
        uses: tj-actions/changed-files@v45
        with:
          files: |
            Dockerfile
            requirements.txt

      - name: Set up Docker Buildx
        if: steps.changed-files-build.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        if: steps.changed-files-build.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Docker image
        if: steps.changed-files-build.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          docker buildx build --push \
            --tag ${{ vars.DOCKERHUB_NAMESPACE }}/${{ vars.DOCKERHUB_REPOSITORY }}:latest \
            --tag ${{ vars.DOCKERHUB_NAMESPACE }}/${{ vars.DOCKERHUB_REPOSITORY }}:${{ github.sha }} \
            .

  unit-and-integration-and-e2e-tests:
    runs-on: ubuntu-latest
    needs: build-and-push-image

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get changed files for tests
        id: changed-files-tests
        uses: tj-actions/changed-files@v45
        with:
          files: |
            dags/**
            include/**
            tests/**
            docker/**
            docker-compose.yaml
            .github/workflows/**

      - name: Create .env file for GitHub Actions
        if: steps.changed-files-tests.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          cat > .env <<EOF
          DOCKERHUB_NAMESPACE=${{ vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_REPOSITORY=${{ vars.DOCKERHUB_REPOSITORY }}
          IMAGE_TAG=latest

          POSTGRES_CONN_USERNAME=${{ secrets.POSTGRES_CONN_USERNAME }}
          POSTGRES_CONN_PASSWORD=${{ secrets.POSTGRES_CONN_PASSWORD }}
          POSTGRES_CONN_HOST=postgres
          POSTGRES_CONN_PORT=5432

          METADATA_DATABASE_NAME=${{ secrets.METADATA_DATABASE_NAME }}
          METADATA_DATABASE_USERNAME=${{ secrets.METADATA_DATABASE_USERNAME }}
          METADATA_DATABASE_PASSWORD=${{ secrets.METADATA_DATABASE_PASSWORD }}

          CELERY_BACKEND_NAME=${{ secrets.CELERY_BACKEND_NAME }}
          CELERY_BACKEND_USERNAME=${{ secrets.CELERY_BACKEND_USERNAME }}
          CELERY_BACKEND_PASSWORD=${{ secrets.CELERY_BACKEND_PASSWORD }}

          ELT_DATABASE_NAME=${{ secrets.ELT_DATABASE_NAME }}
          ELT_DATABASE_USERNAME=${{ secrets.ELT_DATABASE_USERNAME }}
          ELT_DATABASE_PASSWORD=${{ secrets.ELT_DATABASE_PASSWORD }}

          AIRFLOW_UID=${{ vars.AIRFLOW_UID }}
          _AIRFLOW_WWW_USER_USERNAME=${{ secrets.AIRFLOW_WWW_USER_USERNAME }}
          _AIRFLOW_WWW_USER_PASSWORD=${{ secrets.AIRFLOW_WWW_USER_PASSWORD }}
          AIRFLOW_WWW_USER_USERNAME=${{ secrets.AIRFLOW_WWW_USER_USERNAME }}
          AIRFLOW_WWW_USER_PASSWORD=${{ secrets.AIRFLOW_WWW_USER_PASSWORD }}
          FERNET_KEY=${{ secrets.FERNET_KEY }}

          API_KEY=${{ secrets.API_KEY }}
          CHANNEL_HANDLE=${{ vars.CHANNEL_HANDLE }}
          EOF

      - name: Show Docker Compose config
        if: steps.changed-files-tests.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: docker compose config

      - name: Start required Docker Compose services
        if: steps.changed-files-tests.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          docker compose up -d postgres redis airflow-init airflow-scheduler airflow-worker airflow-dag-processor

      - name: Wait for Postgres
        if: steps.changed-files-tests.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          for i in {1..30}; do
            if docker exec postgres pg_isready -U ${{ secrets.POSTGRES_CONN_USERNAME }}; then
              echo "Postgres is ready"
              exit 0
            fi

            echo "Waiting for Postgres..."
            sleep 5
          done

          echo "Postgres did not become ready"
          docker logs postgres
          exit 1

      - name: Wait for Airflow Init
        if: steps.changed-files-tests.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          for i in {1..30}; do
            STATUS=$(docker inspect --format='{{.State.Status}}' yt_elt-airflow-init-1 || true)
            EXIT_CODE=$(docker inspect --format='{{.State.ExitCode}}' yt_elt-airflow-init-1 || true)

            echo "Airflow init status: $STATUS"
            echo "Airflow init exit code: $EXIT_CODE"

            if [ "$STATUS" = "exited" ] && [ "$EXIT_CODE" = "0" ]; then
              echo "Airflow init completed successfully"
              exit 0
            fi

            sleep 5
          done

          echo "Airflow init did not complete successfully"
          docker ps -a
          docker logs yt_elt-airflow-init-1
          exit 1

      - name: Wait for Airflow Worker
        if: steps.changed-files-tests.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          for i in {1..40}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' yt_elt-airflow-worker-1 || true)

            echo "Airflow worker status: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              echo "Airflow worker is healthy"
              exit 0
            fi

            sleep 10
          done

          echo "Airflow worker did not become healthy"
          docker ps -a
          docker logs yt_elt-airflow-worker-1
          exit 1

      - name: Show running containers
        if: always()
        run: docker ps -a

      - name: Print Postgres logs if failed
        if: failure()
        run: docker logs postgres || true

      - name: Print Airflow Init logs if failed
        if: failure()
        run: docker logs yt_elt-airflow-init-1 || true

      - name: Print Airflow Scheduler logs if failed
        if: failure()
        run: docker logs yt_elt-airflow-scheduler-1 || true

      - name: Print Airflow Worker logs if failed
        if: failure()
        run: docker logs yt_elt-airflow-worker-1 || true

      - name: Print Airflow DAG Processor logs if failed
        if: failure()
        run: docker logs yt_elt-airflow-dag-processor-1 || true

      - name: Run Unit and Integration Tests
        if: steps.changed-files-tests.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          docker exec -t yt_elt-airflow-worker-1 sh -c "pytest tests/ -v"

      - name: Run End-to-End DAG Tests
        if: steps.changed-files-tests.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          DAG_NAMES=("produce_json" "update_db" "data_quality")

          for DAG in "${DAG_NAMES[@]}"; do
            echo "Testing DAG: $DAG"
            docker exec -t yt_elt-airflow-worker-1 sh -c "airflow dags test $DAG"
          done

      - name: Tear down Docker Compose
        if: always()
        run: docker compose down -v